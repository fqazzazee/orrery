name: Release

# Push a tag like v1.6.1 to build every package and publish a release with
# them. Run by hand to just build the packages.
#
# The build jobs have a read-only token; only the last job, which runs no
# code from the repository's build, can write to the release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Unit tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs && make test

      - name: Build the packages
        run: CONTAINER=docker packaging/build.sh

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version-name"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "metadata.json says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orrery-packages
          path: dist/

  # Orrery for Windows: the app folder as a zip, the installer and the
  # Lively Wallpaper package, published with the rest by the job below.
  windows:
    needs: release
    runs-on: windows-latest
    env:
      # Code signing runs only once these secrets exist (Azure Artifact
      # Signing, formerly Trusted Signing). Until then the files are unsigned.
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.x

      # windows-latest comes with Inno Setup 6; install it if that changes.
      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the app
        run: windows/build.ps1 -Step publish

      # Signs Orrery.exe and Orrery.scr (not the .NET runtime's own files)
      # before they are zipped and packed. Needs the secrets AZURE_TENANT_ID,
      # AZURE_CLIENT_ID and AZURE_CLIENT_SECRET, and the variables
      # SIGNING_ENDPOINT, SIGNING_ACCOUNT and SIGNING_PROFILE.
      - name: Files to sign
        id: app
        if: env.SIGN == 'true'
        run: |
          $files = (Get-ChildItem dist/windows -Recurse -Include Orrery.exe, Orrery.scr).FullName -join ','
          "files=$files" >> $env:GITHUB_OUTPUT

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ steps.app.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build the zips and the installers
        run: windows/build.ps1 -Step package

      - name: Sign the installers
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: dist/windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Checksums
        run: windows/build.ps1 -Step sums

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orrery-windows
          path: |
            dist/windows/*.*
            dist/windows/SHA256SUMS-windows

  # Both jobs' files, published as one release.
  publish:
    needs: [release, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Orrery ${GITHUB_REF_NAME#v}" \
              --notes-file packaging/release-notes.md
          # Files only: the Windows artifact also holds the app folders.
          find out -maxdepth 1 -type f -print0 | xargs -0 gh release upload "$GITHUB_REF_NAME" --clobber
