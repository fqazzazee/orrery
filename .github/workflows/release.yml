name: Release

# Push a tag like v1.3.2 to build every package and publish a release with
# them. Run by hand to just build the packages.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs && make test

      - name: Build the packages
        run: CONTAINER=docker packaging/build.sh

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("metadata.json"))["version-name"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "metadata.json says $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Orrery ${GITHUB_REF_NAME#v}" \
              --notes-file packaging/release-notes.md
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: orrery-packages
          path: dist/
