name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GJS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs
      - name: Unit tests
        run: make test

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Build the Windows app
        run: dotnet build windows/Orrery -c Release -warnaserror
