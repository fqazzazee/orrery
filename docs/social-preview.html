<!-- Orrery's social preview, 1280x640: the source of social-preview.png, which
     GitHub and the project page use. Rebuild it with
       firefox --headless --window-size=1280,640 --screenshot social-preview.png social-preview.html
     (with the Outfit font installed). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery social preview</title>
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #000; }
  body { position: relative; font-family: "Outfit", Cantarell, sans-serif; color: #eef1f7; }
  .shot { position: absolute; right: -420px; top: -80px; width: 1300px; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #000 0, #000 47%, rgba(0,0,0,0.7) 58%, rgba(0,0,0,0) 74%); }
  .text { position: absolute; left: 72px; top: 150px; width: 560px; }
  .row { display: flex; align-items: center; gap: 22px; }
  .row img { width: 96px; height: 96px; }
  h1 { margin: 0; font-weight: 200; font-size: 104px; letter-spacing: 0.12em; line-height: 1; }
  h1 span { color: #ffc46b; }
  p { font-size: 31px; line-height: 1.35; margin: 34px 0 0; color: #c3c9d6; font-weight: 300; }
  .tags { margin-top: 34px; font-size: 21px; color: #7f889a; letter-spacing: 0.04em; }
  .tags b { color: #7fd0ff; font-weight: 500; }
</style>
</head>
<body>
  <img class="shot" src="screenshots/desktop.webp" alt="">
  <div class="fade"></div>
  <div class="text">
    <div class="row"><img src="icon.svg" alt=""><h1>orrery<span>.</span></h1></div>
    <p>The solar system, live on your desktop, in pure OLED black.</p>
    <div class="tags"><b>GNOME 48–51</b> · KDE · XFCE · Sway · Hyprland</div>
  </div>
</body>
</html>
